name: image-secrets

# Run by hand. Scans every tag of the published image for secrets: Trivy's secret scanner
# on the image, and gitleaks on the image config and on each layer unpacked on its own.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/keniolax/container-hardening/juice-shop
  TARGET_REPO: Keniolax/codeguardian-target
  TARGET_SHA: ad481cc3b779e87d589d4e0e40ccba2ae4e68cea

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          path: src
          persist-credentials: false
      - name: Install tools
        run: |
          scripts/install-tools.sh && echo "$PWD/bin" >> "$GITHUB_PATH"
          curl -fsSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C bin gitleaks && bin/gitleaks version
      - name: Baseline, the Juice Shop source the images are built from
        run: |
          mkdir -p out
          gitleaks dir --no-banner -l error --redact --exit-code 0 -f json -r out/source.gitleaks.json src
          echo "source tree: $(jq length out/source.gitleaks.json) gitleaks findings"
      - name: Scan every tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          path="${IMAGE#ghcr.io/}"
          tok=$(curl -fsS -u "x:$GH_TOKEN" "https://ghcr.io/token?scope=repository:$path:pull" | jq -r .token)
          curl -fsS -H "Authorization: Bearer $tok" "https://ghcr.io/v2/$path/tags/list" | jq -r '.tags[]' \
            | grep -v '^sha256-' | sort > out/tags.txt
          echo "tags: $(wc -l < out/tags.txt)"; cat out/tags.txt
          [ -s out/tags.txt ] || { echo "no tags found"; exit 1; }
          while read -r t; do
            echo "::group::$t"; scripts/image-secrets.sh "$IMAGE:$t" out; echo "::endgroup::"
            docker image rm -f "$IMAGE:$t" > /dev/null; docker system prune -af > /dev/null
          done < out/tags.txt
      - name: Findings by file, marked as in the source tree or not
        run: |
          jq -r '.[].File | sub("^src/"; "")' out/source.gitleaks.json | sort -u > out/source-files.txt
          cat out/*.layer-*.gitleaks.json | jq -r '.[] | "\(.RuleID)\t\(.Entropy)\t\(.File | sub("^/tmp/tmp\\.[^/]+/layer-[0-9]+/"; ""))"' \
            | sort | uniq -c | awk '{print $1"\t"$2"\t"$4}' > out/layer-findings.tsv
          while IFS=$'\t' read -r count rule file; do
            rel="${file#juice-shop/}"
            if grep -qxF "$rel" out/source-files.txt; then where=source; else where=NOT-IN-SOURCE; fi
            printf '%s\t%s\t%s\t%s\n' "$where" "$count" "$rule" "$file"
          done < out/layer-findings.tsv | sort | tee out/layer-findings-marked.tsv
          echo; cat out/summary.txt
          echo "files with findings not in the source tree: $(grep -c '^NOT-IN-SOURCE' out/layer-findings-marked.tsv || true)"
          jq -s -r '[.[] | .Results[]? | .Target as $t | .Secrets[]? | "\(.RuleID)\t\(.Severity)\t\($t)"] | unique | .[]' out/*.trivy-secrets.json \
            | tee out/trivy-secrets.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-secrets
          path: out/
