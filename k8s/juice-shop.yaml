# Juice Shop with the restricted Pod Security settings plus a read-only root filesystem.
# IMAGE_REF is replaced with the signed image's digest by the Makefile.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: juice-shop
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juice-shop
  template:
    metadata:
      labels:
        app: juice-shop
    spec:
      serviceAccountName: juice-shop
      automountServiceAccountToken: false   # no API token for an attacker to steal
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The root filesystem is read-only, so the folders Juice Shop writes are emptyDir
      # volumes. An emptyDir starts empty, so this init container copies the image's
      # files into them first. It uses node, because the image has no shell or cp.
      initContainers:
        - name: seed
          image: IMAGE_REF
          args:
            - -e
            - >-
              const fs = require("fs");
              for (const d of ["logs", "ftp", "data", "i18n", "frontend/dist"])
                fs.cpSync("/juice-shop/" + d, "/seed/" + d, { recursive: true });
          securityContext: &locked
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: logs, mountPath: /seed/logs }
            - { name: ftp, mountPath: /seed/ftp }
            - { name: data, mountPath: /seed/data }
            - { name: i18n, mountPath: /seed/i18n }
            - { name: dist, mountPath: /seed/frontend/dist }
      containers:
        - name: juice-shop
          image: IMAGE_REF
          ports:
            - containerPort: 3000
          securityContext: *locked
          readinessProbe:
            httpGet: { path: /rest/admin/application-version, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: logs, mountPath: /juice-shop/logs }
            - { name: ftp, mountPath: /juice-shop/ftp }
            - { name: data, mountPath: /juice-shop/data }
            - { name: i18n, mountPath: /juice-shop/i18n }
            - { name: dist, mountPath: /juice-shop/frontend/dist }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: logs, emptyDir: { sizeLimit: 64Mi } }
        - { name: ftp, emptyDir: { sizeLimit: 64Mi } }
        - { name: data, emptyDir: { sizeLimit: 256Mi } }
        - { name: i18n, emptyDir: { sizeLimit: 64Mi } }
        - { name: dist, emptyDir: { sizeLimit: 256Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: juice-shop
  namespace: shop
spec:
  selector:
    app: juice-shop
  ports:
    - port: 3000
      targetPort: 3000
