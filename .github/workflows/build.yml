name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Juice Shop v20.3.0 as vendored and measured in week 14.
  TARGET_REPO: Keniolax/codeguardian-target
  TARGET_SHA: ad481cc3b779e87d589d4e0e40ccba2ae4e68cea
  IMAGE: ghcr.io/keniolax/container-hardening/juice-shop
  SIGNER: https://github.com/Keniolax/container-hardening/.github/workflows/build.yml@refs/heads/main
  ISSUER: https://token.actions.githubusercontent.com

jobs:
  compare:
    # The two images the hardened one is measured against. Neither is pushed.
    strategy:
      matrix:
        include:
          - name: baseline
            dockerfile: ../docker/baseline.Dockerfile
          - name: upstream
            dockerfile: Dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          path: src
          persist-credentials: false
      - run: scripts/install-tools.sh && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: src
        run: docker build -q -f "${{ matrix.dockerfile }}" -t "local/${{ matrix.name }}" .
      - run: scripts/measure.sh "${{ matrix.name }}" "local/${{ matrix.name }}" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-${{ matrix.name }}
          path: out/

  hardened:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push the image to GHCR
      id-token: write   # GitHub OIDC token for keyless signing
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          path: src
          persist-credentials: false
      - run: scripts/install-tools.sh && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: src
        run: docker build -q -f ../docker/hardened.Dockerfile -t local/hardened .
      - run: scripts/measure.sh hardened local/hardened out
      - name: Gate on the hardened image
        run: scripts/gate.sh out/hardened.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-hardened
          path: out/

      - name: Push by digest
        id: push
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="$IMAGE:${GITHUB_SHA}"
          docker tag local/hardened "$tag"
          docker push -q "$tag"
          ref=$(docker image inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep "^$IMAGE@")
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"
          echo "Pushed $ref"
      - name: SBOM, sign and attest
        if: github.ref == 'refs/heads/main'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sign
          syft scan "registry:$REF" -q -o spdx-json=sign/sbom.spdx.json
          cosign sign --yes "$REF" 2>&1 | tee sign/sign.log
          cosign attest --yes --type spdxjson --predicate sign/sbom.spdx.json "$REF" 2>&1 | tee sign/attest.log
      - name: Verify, and prove verification can fail
        if: github.ref == 'refs/heads/main'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-signature.sh "$REF" sign
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: signing
          path: sign/

  summary:
    needs: [compare, hardened]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: measure-*
          merge-multiple: true
          path: out
      - run: scripts/summarize.sh out | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The gate must refuse the baseline and upstream images
        run: |
          for n in baseline upstream; do
            if scripts/gate.sh "out/$n.json"; then echo "::error::gate passed $n"; exit 1; fi
            echo "gate refused $n, as it must"
          done

  cluster:
    needs: hardened
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-tools.sh && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Cluster, policies and tests
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.hardened.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: make cluster test-cluster 2>&1 | tee cluster.log
      - name: Snapshot
        if: always()
        run: make snapshot > snapshot.json || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster
          path: |
            cluster.log
            snapshot.json
