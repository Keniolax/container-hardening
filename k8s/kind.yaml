# One-node kind cluster. kind 0.24 and later enforce NetworkPolicy with
# kube-network-policies, so no extra CNI is needed. The node image is pinned by digest,
# as the kind 0.33.0 release notes require.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hardening
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
